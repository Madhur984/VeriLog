<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/circuitverse/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CircuitVerse Simulator</title>
    <!-- jQuery required by CircuitVerse -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- Bootstrap CSS for CV styles -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <!-- Font Awesome required for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <!-- Google Fonts: Raleway (used in canvas text rendering) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <!-- Required global variables expected by the CircuitVerse simulator -->
    <script>
      // These globals are normally provided by the Rails backend.
      // Here we declare them manually for standalone usage.
      window.userSignedIn = false;
      window.isUserLoggedIn = false;
      window.logixProjectId = undefined;
      window.__logix_project_id = undefined;
      window.logix_project_id = undefined;
      window.__projectName = 'Untitled';
      window.restrictedElements = [];
      window.embed = false;
      window.DPR = window.devicePixelRatio || 1;
      window.lightMode = false;
    </script>
    <!-- Main CircuitVerse simulator bundle -->
    <script type="module" crossorigin src="/circuitverse/simulator-v0.js"></script>
</head>
<body>
    <!-- Vue app mounts here; it creates the entire UI including canvas elements -->
    <div id="app"></div>
</body>
</html>

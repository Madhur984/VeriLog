name: Build & Deploy to Hostinger

# Runs on GitHub's own cloud runner (no self-hosted runner needed).
# It builds the frontend, then rsyncs the whole dist/ (app + all videos) into
# bitforbytes.in's public_html over SSH/SFTP. rsync is incremental: the first
# run uploads everything (incl. the 1.3 GB of video); later pushes send only
# what changed.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   SFTP_PORT = 65002
#   SFTP_USER = u849937788
#   SFTP_PASS = <your Hostinger SSH password>
#
# NOTE (2026-08-02): Hostinger moved this account to a NEW server IP
# (46.202.183.228, per hPanel > Advanced > SSH Access). The old SFTP_HOST secret
# still pointed at the retired 46.202.142.103, which is why deploys timed out.
# The current IP is pinned inline below (it's public, not a credential); update
# the inline value if hPanel ever shows a different SSH IP. The SFTP_HOST secret
# is no longer used.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# A new push should PREEMPT a stuck/hung deploy, not queue behind it. With
# cancel-in-progress:false a single hung run (e.g. rsync retrying against a dead
# host) holds this group forever and every later push sits "waiting for a runner".
# cancel-in-progress:true cancels the older in-flight run so the newest push wins
# immediately — safe here because rsync is idempotent + incremental, so the final
# run always fully syncs public_html regardless of what a cancelled run left.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Backstop so a hung SSH/rsync can't pin the runner (or the concurrency group)
    # indefinitely; the whole build+deploy comfortably finishes well under this.
    timeout-minutes: 30
    steps:
      - name: Checkout (incl. videos)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Rsync dist/ to Hostinger public_html
        env:
          SSHPASS: ${{ secrets.SFTP_PASS }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass rsync

          # Hostinger shared-hosting SSH occasionally drops connections from
          # cloud (Azure) runner IPs, surfacing as "Connection timed out" /
          # rsync exit 255. A single attempt makes the whole deploy fail on a
          # transient drop, so retry up to 5 times with backoff, plus SSH
          # keepalives and an rsync stall timeout.
          SSH_OPTS="-p ${{ secrets.SFTP_PORT }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          ok=0
          for i in 1 2 3 4 5; do
            echo "::group::rsync attempt $i/5"
            if sshpass -e rsync -rvz --partial --timeout=180 --chmod=D755,F644 \
                 -e "ssh $SSH_OPTS" \
                 frontend/dist/ \
                 "${{ secrets.SFTP_USER }}@46.202.183.228:domains/bitforbytes.in/public_html/"; then
              ok=1; echo "::endgroup::"; break
            fi
            echo "::endgroup::"
            if [ "$i" -lt 5 ]; then
              wait=$((i * 20))
              echo "Attempt $i failed (transient SSH/rsync error). Retrying in ${wait}s..."
              sleep "$wait"
            fi
          done

          if [ "$ok" -ne 1 ]; then
            echo "Deploy failed after 5 attempts. If this persists, SSH is likely" \
                 "blocked/disabled server-side (see hPanel > Advanced > SSH Access)."
            exit 1
          fi
          echo "Deploy step finished."

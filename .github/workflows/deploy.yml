name: Build & Deploy to Hostinger

# Runs on GitHub's own cloud runner (no self-hosted runner needed).
# It builds the frontend, then deploys in ORDERED passes so the site comes back
# fast and never serves a half-updated page:
#   1. app assets (JS/CSS/images/.htaccess) — new hashed chunks land first
#   2. HTML                                  — flips the site to the new build
#   3. videos (~2 GB)                        — AFTER the site is already live,
#                                              synced ONE FILE AT A TIME so a
#                                              dropped connection costs one file
#                                              instead of the whole batch.
# rsync is incremental, so after the first full upload only changed files move.
#
# Required repo secret (Settings > Secrets and variables > Actions):
#   SFTP_PASS = <your Hostinger SSH password>
#
# Everything else is pinned inline below, straight from hPanel > Advanced >
# SSH Access — none of it is a credential, and as secrets they were only a way
# to drift out of sync silently:
#   IP 46.202.183.228 · port 65002 · user u849937788
# Update these inline values if hPanel ever shows different ones. The SFTP_HOST,
# SFTP_PORT and SFTP_USER secrets are no longer read.
#
# NOTE (2026-08-02): Hostinger moved this account to a NEW server IP. The old
# SFTP_HOST secret still pointed at the retired 46.202.142.103, which is why
# deploys timed out.
#
# NOTE (2026-08-17): deploys failed with "Permission denied (publickey,password)"
# and rsync exit 255. That is AUTH, not connectivity — hPanel confirmed the IP,
# port and username above were all correct and SSH was ACTIVE. Read the error
# text before suspecting a migration: a TIMEOUT means the IP is wrong, whereas
# "Permission denied" means the host is right and the credential is stale.
# A wrong SFTP_USER produces that same message, so user/port were pinned inline
# to leave SFTP_PASS as the only remaining variable.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# A new push should PREEMPT a stuck/hung deploy, not queue behind it. With
# cancel-in-progress:false a single hung run (e.g. rsync retrying against a dead
# host) holds this group forever and every later push sits "waiting for a runner".
# cancel-in-progress:true cancels the older in-flight run so the newest push wins
# immediately — safe here because rsync is idempotent + incremental, so the final
# run always fully syncs public_html regardless of what a cancelled run left.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    # Pinned to 22.04 (a separate hosted-runner pool) because ubuntu-latest (24.04)
    # was congested and jobs sat minutes on "waiting for a hosted runner to come
    # online". If 22.04 ever lags too, ubuntu-latest is the usual default.
    runs-on: ubuntu-22.04
    # Backstop so a hung SSH/rsync can't pin the runner (or the concurrency group)
    # indefinitely. Raised 30 -> 75: checkout alone is now ~5.5 min (the repo
    # carries ~2 GB of video) and a first-time video sync has ~940 MB to push
    # over shared hosting, which did not fit in the old budget.
    timeout-minutes: 75
    steps:
      - name: Checkout (incl. videos)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci || npm install   # ci is fast+cached; fall back if the lockfile drifted
          npm run build

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      # ── The site must come BACK FAST. The app bundle is ~10 MB but the videos
      # are ~1.3 GB, so uploading everything in one pass means the site sits
      # broken (new index.html, but assets/videos not there yet) for the whole
      # upload. Instead we deploy in ordered passes:
      #   1. assets/JS/CSS  (new hashed chunks land first)
      #   2. HTML           (flips the site to the new build — chunks already there)
      #   3. videos         (big + non-critical; runs AFTER the site is already live,
      #                      and is a fast no-op on later deploys since rsync is
      #                      incremental. A video failure does NOT fail the deploy.)
      - name: Deploy app (assets first, then HTML — site is live after this)
        env:
          SSHPASS: ${{ secrets.SFTP_PASS }}
        run: |
          SSH_OPTS="-p 65002 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          TARGET="u849937788@46.202.183.228:domains/bitforbytes.in/public_html/"

          # rsync with up to 5 retries (Hostinger shared SSH sometimes drops cloud
          # runner connections → transient rsync exit 255). Returns non-zero only
          # if all 5 attempts fail.
          rsync_retry() {
            local ok=0 i
            for i in 1 2 3 4 5; do
              echo "::group::rsync attempt $i/5"
              if sshpass -e rsync -rz --partial --timeout=180 --chmod=D755,F644 \
                   -e "ssh $SSH_OPTS" "$@"; then ok=1; echo "::endgroup::"; break; fi
              echo "::endgroup::"
              [ "$i" -lt 5 ] && { echo "attempt $i failed, retrying in $((i*15))s"; sleep $((i*15)); }
            done
            [ "$ok" -eq 1 ]
          }

          # 1) everything EXCEPT html and the big videos dir
          rsync_retry --exclude='videos/' --exclude='*.html' \
            frontend/dist/ "$TARGET" || { echo "app assets failed"; exit 1; }
          # 2) html last — now the site points at chunks that already exist
          rsync_retry --include='*/' --include='*.html' --exclude='*' \
            frontend/dist/ "$TARGET" || { echo "app html failed"; exit 1; }
          echo "✅ App deployed — bitforbytes.in is live on the new build."

      # Runs LAST and on its own, so the app is already live before this starts.
      # It is deliberately NOT continue-on-error any more: the previous version
      # both swallowed failures (continue-on-error) AND ended in a bare `echo`,
      # which returns 0 — so a completely failed sync still reported ✅ while 32
      # videos silently 404'd on the live site. A red run here means "site is up,
      # but lessons are missing their video" — which is worth seeing.
      - name: Sync videos (per-file, resumable)
        env:
          SSHPASS: ${{ secrets.SFTP_PASS }}
        run: |
          SSH_OPTS="-p 65002 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=60 -o ServerAliveInterval=15 -o ServerAliveCountMax=8"
          TARGET="u849937788@46.202.183.228:domains/bitforbytes.in/public_html/videos/"
          if [ ! -d frontend/dist/videos ]; then echo "no videos in build, skipping"; exit 0; fi
          cd frontend/dist/videos

          # ONE FILE PER rsync INVOCATION. Hostinger's shared SSH drops long,
          # high-volume sessions: a single batched rsync of ~940 MB died partway
          # every time, and each retry restarted the whole batch, so it never
          # converged. Short per-file sessions bank progress permanently, and
          # rsync's size+mtime quick-check makes already-uploaded files an
          # instant no-op. No -z — MP4 is already compressed, so it only burns
          # CPU and slows the transfer.
          ok_count=0; failed=0; failures=""
          for f in *.mp4; do
            [ -f "$f" ] || continue
            done_this=0
            for i in 1 2 3; do
              if sshpass -e rsync -t --partial --partial-dir=.rsync-partial \
                   --timeout=180 --chmod=F644 -e "ssh $SSH_OPTS" "$f" "$TARGET"; then
                done_this=1; break
              fi
              [ "$i" -lt 3 ] && { echo "  retry $i for $f"; sleep $((i*10)); }
            done
            if [ "$done_this" -eq 1 ]; then
              ok_count=$((ok_count+1))
            else
              failed=$((failed+1)); failures="$failures $f"; echo "::warning::video failed: $f"
            fi
          done

          echo "videos present on server: $ok_count | failed: $failed"
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed video(s) did not sync:$failures"
            exit 1
          fi
          echo "✅ all $ok_count videos synced"
